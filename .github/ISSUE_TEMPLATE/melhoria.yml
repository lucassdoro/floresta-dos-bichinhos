name: 💡 Ideia ou melhoria
description: Proponha uma melhoria no jogo, no código ou na documentação.
labels: ["melhoria", "em-analise"]
body:
  - type: markdown
    attributes:
      value: |
        O jogo é para crianças de 3 a 7 anos. Toda proposta passa por análise do mantenedor antes de ser implementada — espere a label `aprovada` antes de começar. Veja "Aberto, mas com curadoria" no CONTRIBUTING.md.
  - type: textarea
    id: problem
    attributes:
      label: Qual problema isto resolve?
      description: Por que vale a pena? Quem se beneficia (criança, pais, escola, quem contribui)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Ideias de solução (opcional)
      description: A solução é proposta por quem pegar a issue. Se você já tem uma ideia, esboço ou referência, pode deixar aqui.
    validations:
      required: false
  - type: checkboxes
    id: work
    attributes:
      label: Participação
      options:
        - label: Quero trabalhar nesta issue
