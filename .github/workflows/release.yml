name: Release

# Tag vX.Y.Z publicada => builds de Android (APK e AAB), Windows e Linux e um
# GitHub Release com os arquivos. Disparo manual => só os builds, como artefatos
# (sem Release); sem keystore, o Android sai assinado com a chave de debug.
# Passo a passo: docs/RELEASE.md

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Versão para o teste (ex. 0.1.0)
        required: true
        default: 0.1.0

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2-stable
  TEMPLATES_DIR: ~/.local/share/godot/export_templates/4.7.2.stable

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Versão
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Versão inválida: $VERSION (use X.Y.Z)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          rm godot.zip

      - name: Cache dos templates de exportação
        id: templates-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TEMPLATES_DIR }}
          key: godot-templates-${{ env.GODOT_VERSION }}-android-windows-linux

      - name: Templates de exportação
        if: steps.templates-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          dir=$(eval echo "$TEMPLATES_DIR")
          mkdir -p "$dir"
          unzip -q -j templates.tpz \
            'templates/version.txt' \
            'templates/android_*' \
            'templates/windows_release_x86_64.exe' 'templates/windows_debug_x86_64.exe' \
            'templates/linux_release.x86_64' 'templates/linux_debug.x86_64' \
            -d "$dir"
          rm templates.tpz
          ls -la "$dir"

      - name: Configuração do Android no Godot
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -keypass android \
            -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000 > /dev/null 2>&1
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          sed -i 's/^          //' ~/.config/godot/editor_settings-4.7.tres

      - name: Keystore de release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Sem ANDROID_KEYSTORE_BASE64: Android só em modo de teste (debug)."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Builds
        env:
          GODOT: godot
          VERSION: ${{ steps.version.outputs.version }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_DEBUG_FALLBACK: ${{ github.ref_type != 'tag' && '1' || '0' }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ] && [ -z "${GODOT_ANDROID_KEYSTORE_RELEASE_PATH:-}" ]; then
            echo "::error::Tag de versão sem keystore de release nos secrets (veja docs/RELEASE.md)."
            exit 1
          fi
          tools/build/export.sh "$VERSION" "$GITHUB_SHA"

      - name: Logs do build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ steps.version.outputs.version }}
          path: build/*/*.log
          retention-days: 14

      - name: Builds de teste
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: builds-${{ steps.version.outputs.version }}
          path: |
            build/*/*.apk
            build/*/*.aab
            build/*/*.zip
            build/*/*.tar.gz
          retention-days: 7

      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Floresta dos Bichinhos $VERSION" \
            --generate-notes \
            build/"$VERSION"/*.apk build/"$VERSION"/*.aab \
            build/"$VERSION"/*.zip build/"$VERSION"/*.tar.gz
