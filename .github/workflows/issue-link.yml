name: Issue ligada

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: PR cita uma issue com Closes/Fixes/Resolves
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$PR_BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+'; then
            echo "Issue ligada encontrada."
            exit 0
          fi
          echo "::error::Todo PR precisa de uma issue. Adicione 'Closes #N' na descrição (veja CONTRIBUTING.md)."
          exit 1
